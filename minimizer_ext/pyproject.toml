[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "minimizer-ext"
version = "0.1.0"
description = "PyO3 wrapper around rust-seq/minimizer-iter (canonical w,k-minimizers)."
requires-python = ">=3.9"
classifiers = ["Programming Language :: Rust"]

[tool.maturin]
bindings = "pyo3"
